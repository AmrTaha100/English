name: Generate Vocabulary Audio

on:
  push:
    branches:
      - main
    paths-ignore:
      - "audio/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocabulary-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install TTS generator
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Generate and clean audio
        run: npm run generate:audio

      - name: Commit audio changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A audio

          if git diff --cached --quiet; then
            echo "No audio changes to commit."
            exit 0
          fi

          git commit -m "Generate vocabulary audio [skip ci]"
          git push
